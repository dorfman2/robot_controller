# Armold Robot Arm — Klipper Configuration
# BTT Octopus MAX EZ V1.0, STM32H723, 7-axis robot arm
#
# This is the validated Phase-7 reference copy of the config that lives on the
# Pi at ~/printer_data/config/printer.cfg. Keep them in sync.
#
# GCODE_AXIS mapping (XYZ/E/F/N are reserved by Klipper):
#   W = Linear Rail (stepper_x)
#   A = J0 Base (stepper_y)
#   B = J1 Shoulder (stepper_z)
#   C = J2 Elbow (stepper_a)
#   D = J3 Wrist Pitch (stepper_b)
#   H = J4 Wrist Roll (stepper_c)
#   U = J5 Wrist Yaw (stepper_u)
#
# Coordinated motion example (register axes first, then G1; do NOT mix the rail
# W (mm) with degree axes in one G1 — the feedrate blends unpredictably):
#   REGISTER_AXES
#   G1 A90 B-30 C70 D50 F1200
#
# Per-joint run/hold current (all sense_resistor 0.050 — EZ5160 is a 50mOhm driver):
#   rail(x) 0.8/0.3 | base(y) 1.0/1.0 | shoulder(z) 1.5/1.1 | elbow(a) 1.2/1.0
#   J3 pitch(b) 0.5/0.3 | roll(c) 0.5/0.3 | yaw(u) 0.5/0.3  (wrist joints, light load)
# Shoulder needs 1.0A run+hold to lift/hold the fully-extended arm.
#
# Homing: manual (StallGuard sensorless abandoned — belt skips before the motor
# stalls, no usable SGT window). RELEASE_RAIL -> push carriage to home (neg) end
# -> SET_RAIL_HOME. Arm joints: SET_ARM_HOME. StallGuard config on stepper_x is
# left in place but dormant (diag1_pin ^!PF0, driver_SGT 20, virtual_endstop).
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_380009001151313531383332-if00

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# ============ STEPPERS ============
# Motor-1: Linear Rail (GCODE_AXIS=W)
# NOTE: the [tmc5160 ...] section MUST precede its [manual_stepper ...] section —
# manual_stepper resolves endstop_pin at init, before the tmc section registers
# the tmc5160_stepper_x:virtual_endstop chip. Ordering matters here (unlike
# kinematic steppers, which load late with the toolhead).
[tmc5160 manual_stepper stepper_x]
cs_pin: PG14
sense_resistor: 0.050
diag1_pin: ^!PF0
driver_SGT: 20
spi_bus: spi4
run_current: 0.800
hold_current: 0.300
stealthchop_threshold: 0
[manual_stepper stepper_x]
step_pin: PC13
endstop_pin: tmc5160_stepper_x:virtual_endstop
dir_pin: !PC14
enable_pin: !PE6
microsteps: 16
rotation_distance: 40
# GT2 20T: 2mm pitch * 20 teeth = 40mm per motor rev
# 80 steps/mm (16 microsteps * 200 steps / 40mm)
velocity: 80
accel: 500
# Motor-2: J0 Base (GCODE_AXIS=A)
[manual_stepper stepper_y]
step_pin: PE4
dir_pin: PE5
enable_pin: !PE3
microsteps: 16
rotation_distance: 13.87
# 360 / 25.95 gear ratio = 13.87 degrees per motor rev
# 230.6 steps/degree (16 * 200 / 13.87) — verified: commanded 90deg = 90deg physical
velocity: 30
accel: 900
# Motor-3: J1 Shoulder (GCODE_AXIS=B)
[manual_stepper stepper_z]
step_pin: PE1
dir_pin: PE0
enable_pin: !PE2
microsteps: 16
rotation_distance: 13.87
velocity: 30
accel: 900
# Motor-4: J2 Elbow (GCODE_AXIS=C)
[manual_stepper stepper_a]
step_pin: PB8
dir_pin: PB9
enable_pin: !PB7
microsteps: 16
rotation_distance: 13.87
velocity: 30
accel: 900
# Motor-5: J3 Wrist Pitch (GCODE_AXIS=D)
[manual_stepper stepper_b]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 13.87
velocity: 30
accel: 900
# Motor-6: J4 Wrist Roll (GCODE_AXIS=H)
[manual_stepper stepper_c]
step_pin: PG15
dir_pin: PB3
enable_pin: !PD5
microsteps: 16
rotation_distance: 13.87
velocity: 30
accel: 900
# Motor-7: J5 Wrist Yaw (GCODE_AXIS=U) — DIRECT DRIVE, no gearbox
[manual_stepper stepper_u]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD4
microsteps: 16
rotation_distance: 360
# Direct drive: 1 motor rev = 360 degrees
# 8.889 steps/degree (16 * 200 / 360)
velocity: 60
accel: 900
# ============ TMC5160 SPI ============
[tmc5160 manual_stepper stepper_y]
cs_pin: PG13
sense_resistor: 0.050
spi_bus: spi4
run_current: 1.000
hold_current: 1.000
stealthchop_threshold: 0
[tmc5160 manual_stepper stepper_z]
cs_pin: PG12
sense_resistor: 0.050
spi_bus: spi4
run_current: 1.500
hold_current: 1.100
stealthchop_threshold: 0
[tmc5160 manual_stepper stepper_a]
cs_pin: PG11
sense_resistor: 0.050
spi_bus: spi4
run_current: 1.200
hold_current: 1.000
stealthchop_threshold: 0
[tmc5160 manual_stepper stepper_b]
cs_pin: PG10
sense_resistor: 0.050
spi_bus: spi4
run_current: 0.500
hold_current: 0.300
stealthchop_threshold: 0
[tmc5160 manual_stepper stepper_c]
cs_pin: PG9
sense_resistor: 0.050
spi_bus: spi4
run_current: 0.500
hold_current: 0.300
stealthchop_threshold: 0
[tmc5160 manual_stepper stepper_u]
cs_pin: PD7
sense_resistor: 0.050
spi_bus: spi4
run_current: 0.500
hold_current: 0.300
stealthchop_threshold: 0
# ============ GRIPPER SERVO ============
# 50 deg = OPEN, 120 deg = CLOSED (SET_SERVO SERVO=gripper ANGLE=n). 5V BEC powered.
# Recalibrated after re-centering the servo horn; UI slider limited to 50-120.
[servo gripper]
pin: PA1
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
# ============ VIRTUAL SD CARD ============
[virtual_sdcard]
path: ~/printer_data/gcodes
# ============ MISC ============
[pause_resume]
# ============ MACROS ============
[gcode_macro REGISTER_AXES]
description: Register manual steppers as G-code axes for coordinated motion (XYZEFN reserved by Klipper)
gcode:
  MANUAL_STEPPER STEPPER=stepper_x GCODE_AXIS=W
  MANUAL_STEPPER STEPPER=stepper_y GCODE_AXIS=A
  MANUAL_STEPPER STEPPER=stepper_z GCODE_AXIS=B
  MANUAL_STEPPER STEPPER=stepper_a GCODE_AXIS=C
  MANUAL_STEPPER STEPPER=stepper_b GCODE_AXIS=D
  MANUAL_STEPPER STEPPER=stepper_c GCODE_AXIS=H
  MANUAL_STEPPER STEPPER=stepper_u GCODE_AXIS=U
[gcode_macro SET_ARM_HOME]
description: Set all arm joints to zero (manual home)
gcode:
  MANUAL_STEPPER STEPPER=stepper_x SET_POSITION=0
  MANUAL_STEPPER STEPPER=stepper_y SET_POSITION=0
  MANUAL_STEPPER STEPPER=stepper_z SET_POSITION=0
  MANUAL_STEPPER STEPPER=stepper_a SET_POSITION=0
  MANUAL_STEPPER STEPPER=stepper_b SET_POSITION=0
  MANUAL_STEPPER STEPPER=stepper_c SET_POSITION=0
  MANUAL_STEPPER STEPPER=stepper_u SET_POSITION=0
# ============ BOARD/MOTOR COOLING FAN ============
# FAN5 header = PF8 (PWM). Set the VF5 voltage-select jumper to match the fan!
[fan_generic motor_fan]
pin: PF8
# ============ MANUAL RAIL HOMING ============
# StallGuard sensorless homing was not viable on this belt axis (belt skips
# before the motor stalls). Manual homing procedure instead:
#   1) RELEASE_RAIL   2) push carriage to the HOME (negative) end   3) SET_RAIL_HOME
[gcode_macro RELEASE_RAIL]
description: De-energize the rail so the carriage can be moved by hand
gcode:
  MANUAL_STEPPER STEPPER=stepper_x ENABLE=0
  { action_respond_info("Rail released. Push carriage firmly to the HOME (negative) end, then run SET_RAIL_HOME.") }
[gcode_macro SET_RAIL_HOME]
description: Set rail zero at the current position (carriage must be at the home end)
gcode:
  MANUAL_STEPPER STEPPER=stepper_x SET_POSITION=0
  { action_respond_info("Rail home set to 0.") }

# Arm sags to the desk if steppers disable, so extend the idle timeout well
# beyond the 600s default (applies on firmware restart). Park the arm in a safe
# pose before any long idle regardless.
[idle_timeout]
timeout: 7200
